name: Build & release

# main  → checks + docker image ghcr.io/<owner>/headscale-gui:latest
# v*    → checks + docker image :<version> + GitHub Release with the static build zip
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx svelte-check --tsconfig ./tsconfig.json
      - run: npm run test:mock
      - run: ENDPOINT=/admin npm run build
      # static release asset: files live under admin/ so they unzip straight into a web root
      - name: Package static build
        run: mkdir -p out/admin && cp -r build/. out/admin/ && (cd out && zip -qr ../headscale-gui-admin.zip admin)
      - uses: actions/upload-artifact@v4
        with: { name: headscale-gui-admin, path: headscale-gui-admin.zip }
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: headscale-gui-admin.zip
          generate_release_notes: true

  docker:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
